name: Deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch site bundle
        run: |
          URL="https://filebin.net/hwdeploy-20261112/hongwei-site.zip"
          curl -sS -c cookies.txt -b cookies.txt -L -o warning.html "$URL"
          curl -sS -c cookies.txt -b cookies.txt -L -o site.zip "$URL"
          if ! file site.zip | grep -q 'Zip archive'; then
            echo 'Downloaded content is not a ZIP file'
            head -c 500 warning.html || true
            exit 1
          fi
          unzip -q site.zip -d site

      - name: Restore binary assets
        run: |
          find site/public -type f -name '*.b64' | while read -r f; do
            base64 --decode "$f" > "${f%.b64}"
            rm "$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
